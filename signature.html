<style>
  /* ================= ENTRANCE (plays once) ================= */
  @keyframes sigCardIn   { from{ opacity:0; transform:translateY(16px) scale(.99); } to{ opacity:1; transform:none; } }
  @keyframes sigRise     { from{ opacity:0; transform:translateY(10px); }            to{ opacity:1; transform:none; } }
  @keyframes sigRailIn   { from{ opacity:0; transform:translateX(-10px); }           to{ opacity:1; transform:none; } }
  @keyframes sigPhotoIn  { from{ opacity:0; transform:scale(1.05); }                 to{ opacity:1; transform:none; } }

  /* ================= IDLE (subtle, professional loop) ================= */
  @keyframes sigFloat    { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  /* diagonal glare sweeps once, then holds fully off-screen (both ends invisible) so the loop never snaps */
  @keyframes sigSheen    { 0%{ transform:translateX(-70px) skewX(-18deg); } 26%{ transform:translateX(200px) skewX(-18deg); } 100%{ transform:translateX(200px) skewX(-18deg); } }

  .sig-card{ animation: sigCardIn .95s cubic-bezier(.16,1,.3,1) both; }
  .sig-rail-item{ opacity:0; }
  .sig-r1{ animation: sigRailIn .7s ease-out .35s both; }
  .sig-r2{ animation: sigRailIn .7s ease-out .48s both; }
  .sig-r3{ animation: sigRailIn .7s ease-out .61s both; }
  .sig-name{ animation: sigRise .8s ease-out .42s both; }
  .sig-title{ animation: sigRise .8s ease-out .50s both; }
  .sig-hairline{ animation: sigRise .8s ease-out .58s both; }
  .sig-line1{ animation: sigRise .8s ease-out .66s both; }
  .sig-line2{ animation: sigRise .8s ease-out .74s both; }

  .sig-photo-wrap{ animation: sigPhotoIn 1s cubic-bezier(.16,1,.3,1) .22s both, sigFloat 7s ease-in-out 1.6s infinite; }
  /* 'both' fill = stays off-screen during the delay, so no static streak before the first sweep */
  .sig-sheen{ animation: sigSheen 6.5s ease-in-out 2.4s infinite both; }

  .sig-rail-item a{ transition: color .2s ease, transform .2s ease; display:inline-block; }
  .sig-rail-item a:hover{ color:#2563eb; transform:translateY(-2px) scale(1.12); }
  .sig-photo{ transition: transform .5s ease; }
  .sig-photo-wrap:hover .sig-photo{ transform:scale(1.04); }

  @media (prefers-reduced-motion: reduce){
    .sig-card,.sig-rail-item,.sig-name,.sig-title,.sig-line1,.sig-line2,.sig-hairline,.sig-photo-wrap,.sig-sheen{ animation:none !important; opacity:1 !important; }
  }
</style>
