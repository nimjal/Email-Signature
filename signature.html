<!--
  ══════════════════════════════════════════════════════════════════
  EMAIL SIGNATURE  ·  Nimit Jalan
  ──────────────────────────────────────────────────────────────────
  HOW TO USE
    1. Open this file in a browser.
    2. Ctrl/Cmd + A, then Ctrl/Cmd + C.
    3. Paste into Gmail → Settings → General → Signature.
    Copy the RENDERED page, not this source code.
    In the message body, leave ONE blank line between your sign-off
    ("Kind Regards,") and the signature block.

  DESIGN NOTES
    · Every style is INLINE. Gmail's signature editor deletes
      <style> blocks, classes, :hover, @keyframes and @media.
    · Layout is <table>-based. Gmail strips `position` and `float`.
    · Images are pre-cropped to their final aspect ratio, because
      Gmail ignores `object-fit` and would stretch them instead.
    · ONE hairline only (the vertical divider). The previous version
      had a top rule AND a vertical rule that never met — two sides
      of a box that doesn't close, which is what read as unfinished.

  ASSETS  — two things to do in the repo
    1. Re-export at 2×, keep the width/height attrs at 1×:
         profile.png    → 224 × 280   (displayed 112 × 140)
         icons/*.png    →  36 ×  36   (displayed  18 ×  18)
       The old comment claimed 2× but the files were 1×.
    2. Served via jsDelivr, not raw.githubusercontent. raw.* is not
       a CDN, rate-limits, and sends Cache-Control: no-cache, which
       fights Gmail's image proxy. jsDelivr caches @main for ~12h —
       to force an update, tag a release and swap @main for @v2.

  ROW MATH — the right column sums to exactly 140px, the portrait
  height, so the two columns bottom out together. If you add or
  remove a row, rebalance the paddings or the block goes ragged.
      name 27 + 6 + role 15 + 16 + site 21 + 2 + writing 21
           + 14 + icons 18  =  140

  PALETTE
    Ink       #1f2937      Accent    #0f766e
    Body      #64748b      Hairline  #e3e7ed
    (Ink and body lightened from near-black — they survive Gmail
     dark-mode inversion better than #0f172a did.)
  ══════════════════════════════════════════════════════════════════
-->
