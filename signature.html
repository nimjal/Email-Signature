  HOW TO USE
    1. Open this file in a browser.
    2. Ctrl/Cmd + A, then Ctrl/Cmd + C.
    3. Paste into Gmail → Settings → General → Signature.
    Copy the RENDERED page, not this source code.

  DESIGN NOTES — why this file looks the way it does
    · Every style is INLINE. Gmail's signature editor deletes
      <style> blocks, classes, :hover, @keyframes and @media, so
      anything defined there would silently vanish on paste.
    · Layout is <table>-based. Gmail strips `position` and `float`.
    · Images are pre-cropped to their final aspect ratio, because
      Gmail ignores `object-fit` and would stretch them instead.
    · Images are served at 2× and displayed at 1× for retina.
